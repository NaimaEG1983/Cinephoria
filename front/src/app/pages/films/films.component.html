<section class="py-4 bg-dark-soft flex-grow-1 min-vh-100">
  <div class="container px-3 px-sm-4 px-md-5">
    
    <div class="mb-4">
      <h2 class="text-white fs-5 fw-medium font-family-Inter m-0 border-start border-success border-3 ps-3">
        Tous les films à l'affiche
      </h2>
    </div>
    
    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-3 row-cols-lg-4 row-cols-xl-4 g-4 justify-content-center">
      
      @for (film of filmsAffiches; track film.film_id) {
        <div class="col">
          <div class="card h-100 bg-black border border-secondary border-opacity-25 rounded-4 overflow-hidden movie-card shadow p-0">
            
            <div class="ratio-affiche overflow-hidden w-100">
              <img [src]="film.affiche_image" [alt]="film.titre" class="w-100 h-100" style="object-fit: cover;">
            </div>
            
            <div class="card-body d-flex flex-column justify-content-between p-3">
              <div class="d-flex align-items-center mb-2" style="min-height: 24px;">
                <h3 class="card-title text-white fs-6 fw-bold font-family-Inter text-truncate m-0 w-100" [title]="film.titre">
                  {{ film.titre }}
                </h3>
              </div>
              
              <div class="d-flex justify-content-between align-items-center mt-auto w-100" style="min-height: 38px;">
                <span class="text-white-50 fs-7 fw-normal font-family-Inter me-2" 
                      style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"
                      [title]="film.genre">
                  {{ film.genre || 'N/A' }}
                </span>
                <span class="badge bg-dark text-success-subtle border border-secondary border-opacity-50 font-family-Inter fs-7 fw-normal flex-shrink-0 p-1 px-2">
                  {{ film.duree | dureeFormat }}
                </span>
              </div>
            </div>

          </div>
        </div>
      } @empty {
        <div class="col-12 text-center text-white-50 py-5 font-family-Inter">
          <i class="bi bi-film fs-2 d-block mb-2 text-secondary"></i>
          Aucun film n'est disponible pour le moment.
        </div>
      }

    </div>

    @if (derniersFilms && derniersFilms.length > 8) {
      <div class="text-center mt-4">
        <button (click)="voirTout = !voirTout" class="btn btn-outline-success btn-sm px-4 py-2 font-family-Inter fw-medium">
          @if (!voirTout) {
            <i class="bi bi-chevron-down me-2"></i>Voir plus de films
          } @else {
            <i class="bi bi-chevron-up me-2"></i>Voir moins
          }
        </button>
      </div>
    }

  </div>
</section>
